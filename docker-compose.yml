services:

  mysql:
    image: mysql:8.0
    container_name: amazon-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: amazon_clone

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    networks:
      - amazon-network

  backend:
    image: vrak45/amazon-backend:latest
    container_name: amazon-backend
    restart: unless-stopped

    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: amazon_clone
      JWT_SECRET: practice-project-secret-change-later

    depends_on:
      - mysql

    networks:
      - amazon-network

  frontend:
    image: vrak45/amazon-frontend:latest
    container_name: amazon-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - amazon-network

volumes:
  mysql_data:

networks:
  amazon-network:
    driver: bridge
